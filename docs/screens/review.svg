<svg xmlns="http://www.w3.org/2000/svg" width="420" height="700" viewBox="0 0 420 700">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff6bcb"/>
    </linearGradient>
    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5f5f"/></linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ea1ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient>
  </defs>

  <rect x="10" y="10" width="400" height="680" rx="28" fill="#16151b" stroke="#38343f"/>

  <!-- header -->
  <rect x="10" y="10" width="400" height="60" rx="28" fill="#1c1a21"/>
  <rect x="10" y="42" width="400" height="28" fill="#1c1a21"/>
  <rect x="30" y="26" width="32" height="32" rx="10" fill="#2a2731"/>
  <path d="M46 32l-8 10 8 10" stroke="#f7f6f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="74" y="27" width="30" height="30" rx="8" fill="url(#cover)"/>
  <text x="114" y="46" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f7f6f8">Sexta de Verão</text>

  <!-- heading -->
  <text x="30" y="108" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f7f6f8">Revise suas escolhas</text>
  <text x="30" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a7a3ac">Última chance de mudar de ideia — elas vão</text>
  <text x="30" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a7a3ac">direto pra Sexta de Verão.</text>

  <!-- track cards -->
  <rect x="30" y="166" width="360" height="70" rx="14" fill="#201e26" stroke="#38343f"/>
  <rect x="44" y="180" width="42" height="42" rx="10" fill="url(#thumb1)"/>
  <text x="98" y="198" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f7f6f8">Ai Se Eu Te Pego</text>
  <text x="98" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a7a3ac">Michel Teló · 2:58</text>

  <rect x="30" y="246" width="360" height="70" rx="14" fill="#201e26" stroke="#38343f"/>
  <rect x="44" y="260" width="42" height="42" rx="10" fill="url(#thumb2)"/>
  <text x="98" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f7f6f8">Evidências</text>
  <text x="98" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a7a3ac">Chitãozinho &amp; Xororó · 4:21</text>

  <!-- notice -->
  <rect x="30" y="332" width="360" height="52" rx="12" fill="#201e26"/>
  <rect x="30" y="332" width="3" height="52" rx="1.5" fill="#ff5fa8"/>
  <circle cx="56" cy="358" r="9" fill="none" stroke="#ff5fa8" stroke-width="1.6"/>
  <path d="M56 353v6M56 362h.01" stroke="#ff5fa8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="74" y="353" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#a7a3ac">Depois de confirmar, não dá pra trocar</text>
  <text x="74" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#a7a3ac">— são só 2.</text>

  <!-- footer button -->
  <rect x="30" y="600" width="360" height="52" rx="26" fill="#ff5fa8"/>
  <text x="210" y="632" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a0e1c">Adicionar à playlist</text>
</svg>
